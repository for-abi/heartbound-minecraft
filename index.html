<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A special Valentine's message just for you 💜">
  <title>Be My Valentine 💜</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ── Design tokens ─────────────────────────────────────────── */
    :root {
      --clr-bg-from:    #3b0a57;
      --clr-bg-to:      #0f2e25;
      --clr-card-from:  #5b1c87;
      --clr-card-to:    #174f3d;
      --clr-yes-from:   #c084ff;
      --clr-yes-to:     #34f5c5;
      --clr-yes-text:   #1a0f2a;
      --clr-no-bg:      rgba(255,255,255,0.12);
      --clr-glow-card:  rgba(180,100,255,0.45);
      --clr-glow-img:   rgba(255,150,255,0.45);
      --clr-white:      #ffffff;
      --radius-card:    28px;
      --radius-btn:     999px;
      --font-base:      'Quicksand', sans-serif;
      --transition:     0.3s ease;
    }

    /* ── Reset & base ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: var(--font-base);
      background: linear-gradient(135deg, var(--clr-bg-from), var(--clr-bg-to));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--clr-white);
    }

    /* ── Card ──────────────────────────────────────────────────── */
    .card {
      position: relative;
      width: min(360px, 92vw);
      padding: clamp(20px, 5vw, 36px);
      border-radius: var(--radius-card);
      text-align: center;
      background: linear-gradient(145deg, var(--clr-card-from), var(--clr-card-to));
      box-shadow: 0 0 48px var(--clr-glow-card);
      transition: box-shadow var(--transition), transform var(--transition);
      z-index: 1;
    }

    .card:hover {
      box-shadow: 0 0 64px var(--clr-glow-card);
      transform: translateY(-3px);
    }

    /* ── Typography ────────────────────────────────────────────── */
    .card__title {
      font-size: clamp(1.25rem, 4vw, 1.6rem);
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .card__subtitle {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-bottom: 12px;
    }

    /* ── Image ─────────────────────────────────────────────────── */
    .card__image {
      width: min(210px, 70%);
      aspect-ratio: 1;
      border-radius: 20px;
      margin: 12px auto 20px;
      display: block;
      object-fit: cover;
      box-shadow: 0 0 28px var(--clr-glow-img);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .card__image:hover {
      transform: scale(1.04);
      box-shadow: 0 0 40px var(--clr-glow-img);
    }

    /* ── Buttons ───────────────────────────────────────────────── */
    .buttons {
      position: relative;
      display: flex;
      justify-content: center;
      gap: 16px;
      min-height: 52px;
      margin-top: 8px;
    }

    .btn {
      padding: 10px 24px;
      border-radius: var(--radius-btn);
      border: none;
      font-family: var(--font-base);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform var(--transition), opacity var(--transition),
                  box-shadow var(--transition), font-size var(--transition);
      user-select: none;
      white-space: nowrap;
    }

    .btn:focus-visible {
      outline: 3px solid var(--clr-yes-from);
      outline-offset: 3px;
    }

    .btn--yes {
      background: linear-gradient(135deg, var(--clr-yes-from), var(--clr-yes-to));
      color: var(--clr-yes-text);
      box-shadow: 0 4px 18px rgba(192,132,255,0.45);
    }

    .btn--yes:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 28px rgba(192,132,255,0.65);
    }

    .btn--no {
      background: var(--clr-no-bg);
      color: var(--clr-white);
      border: 1px solid rgba(255,255,255,0.2);
      position: absolute;
    }

    /* ── "No" retreat label ────────────────────────────────────── */
    .no-counter {
      font-size: 0.75rem;
      opacity: 0.55;
      margin-top: 6px;
      min-height: 1em;
      transition: opacity 0.3s;
    }

    /* ── Success screen ────────────────────────────────────────── */
    .success-screen {
      animation: popIn 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }

    .success-screen .card__title {
      font-size: clamp(1.5rem, 5vw, 2rem);
    }

    .success-message {
      font-size: clamp(1rem, 3vw, 1.2rem);
      line-height: 1.6;
      margin-top: 16px;
      opacity: 0;
      animation: fadeUp 0.6s 0.4s ease forwards;
    }

    /* ── Confetti particle ─────────────────────────────────────── */
    .confetti {
      position: fixed;
      top: -20px;
      border-radius: 3px;
      opacity: 0;
      animation: confettiFall linear forwards;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Floating hearts ───────────────────────────────────────── */
    .heart {
      position: fixed;
      bottom: -60px;
      pointer-events: none;
      animation: floatUp linear forwards;
      z-index: 0;
    }

    /* ── Keyframes ─────────────────────────────────────────────── */
    @keyframes floatUp {
      0%   { transform: translateY(0)   rotate(0deg);   opacity: 0; }
      10%  { opacity: 0.9; }
      90%  { opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(30deg); opacity: 0; }
    }

    @keyframes popIn {
      from { transform: scale(0.6); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    @keyframes fadeUp {
      from { transform: translateY(14px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg);    opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }

    /* ── Reduced-motion override ───────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .heart, .confetti { animation: none; display: none; }
      .card:hover, .card__image:hover, .btn--yes:hover { transform: none; }
    }
  </style>
</head>

<body>

  <main>
    <article class="card" id="card" aria-live="polite">
      <h1 class="card__title">Will you be my Valentine? 💜</h1>
      <p class="card__subtitle">Click wisely 👀</p>

      <img
        class="card__image"
        src="https://cdn.discordapp.com/attachments/1100110485661167728/1462903265745305711/IMG_20260120_001434.jpg?ex=69922955&is=6990d7d5&hm=69de23955dd63535b6c9d79d4341b72dc4c8fc3601b593408ca657de787022ad&"
        alt="Us together 💜"
        loading="eager"
      >

      <div class="buttons" id="buttons">
        <button class="btn btn--yes" id="yes" onclick="sayYes()">YES 💚</button>
        <!-- ontouchstart is intentional: the No button runs away on touch too (game mechanic) -->
        <button class="btn btn--no"  id="no"  onmouseover="retreatNo()" ontouchstart="retreatNo()">NO 😭</button>
      </div>
      <p class="no-counter" id="noCounter" aria-live="polite"></p>
    </article>
  </main>

  <script>
    /* ── State ────────────────────────────────────────────────── */
    let noClicks = 0;

    const noMessages = [
      "Nope, that option has moved 😏",
      "Nice try… 👀",
      "It keeps running away! 🏃",
      "You can't catch it 😂",
      "Just click YES already 🥺",
      "The button is scared of you 😅",
      "It refuses to be caught 💨",
      "Give up and say yes! 💜",
    ];

    /* ── No-button retreat ────────────────────────────────────── */
    function retreatNo() {
      const no      = document.getElementById("no");
      const counter = document.getElementById("noCounter");
      const buttons = document.getElementById("buttons");
      const area    = buttons.getBoundingClientRect();

      /* Shrink the button a little each dodge (min 60% of original) */
      const shrink = Math.max(0.6, 1 - noClicks * 0.06);
      no.style.fontSize = `${shrink}rem`;

      /* Pick a random position within the card's button area */
      const maxX = area.width  - no.offsetWidth;
      const maxY = area.height - no.offsetHeight;
      no.style.left = Math.random() * maxX + "px";
      no.style.top  = Math.random() * maxY + "px";

      /* Update snark label */
      counter.textContent = noMessages[Math.min(noClicks, noMessages.length - 1)];

      noClicks++;
    }

    /* ── Yes handler ──────────────────────────────────────────── */
    function sayYes() {
      const card = document.getElementById("card");

      card.innerHTML = `
        <div class="success-screen">
          <h1 class="card__title">YAYYYYY 💜💚</h1>
          <p class="success-message">
            I LOVE YOU SO MUCH MY BABY<br>
            MWAH MWAH 😘💜<br>
            YOU'RE MY VALENTINE FOREVER!
          </p>
        </div>
      `;

      /* Burst of confetti */
      burstConfetti(60);
    }

    /* ── Confetti burst ───────────────────────────────────────── */
    function burstConfetti(count) {
      const colors = ["#c084ff","#34f5c5","#ff6fd8","#fff176","#80deea"];
      for (let i = 0; i < count; i++) {
        const el = document.createElement("div");
        el.className = "confetti";
        el.style.left        = Math.random() * 100 + "vw";
        el.style.width       = (Math.random() * 8 + 6)  + "px";
        el.style.height      = (Math.random() * 14 + 8) + "px";
        el.style.background  = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDuration = (Math.random() * 2 + 2) + "s";
        el.style.animationDelay    = (Math.random() * 1.5)   + "s";
        document.body.appendChild(el);
        el.addEventListener("animationend", () => el.remove(), { once: true });
      }
    }

    /* ── Floating hearts ──────────────────────────────────────── */
    function spawnHeart() {
      const emojis   = ["💜","💚","💜","💚","✨","🌿"];
      const el       = document.createElement("div");
      el.className   = "heart";
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left            = Math.random() * 100 + "vw";
      el.style.fontSize        = (Math.random() * 14 + 14) + "px";
      el.style.animationDuration = (Math.random() * 4 + 5) + "s";
      document.body.appendChild(el);
      el.addEventListener("animationend", () => el.remove(), { once: true });
    }

    setInterval(spawnHeart, 750);
  </script>

</body>
</html>
